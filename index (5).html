<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수학 한 걸음</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f6fb;--ink:#1d2b4f;--sub:#6b7a99;--card:#fff;--line:#d3deee;--acc:#16a87a;--accd:#0d7d59;--sun:#ffbf2f;--sund:#d99a0b;--bad:#e8454a;--badbg:#ffe1e1;--goodbg:#d8f5e8;--lock:#c9d3e4;--lockd:#aab6cc;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a30;--ink:#eaf0ff;--sub:#9aa8c8;--card:#1a2441;--line:#2c3a62;--goodbg:#123a2d;--badbg:#44212a;--lock:#2c3a62;--lockd:#222d4e}}
:root[data-theme="dark"]{--bg:#111a30;--ink:#eaf0ff;--sub:#9aa8c8;--card:#1a2441;--line:#2c3a62;--goodbg:#123a2d;--badbg:#44212a;--lock:#2c3a62;--lockd:#222d4e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-weight:500;
 background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
h1,h2,.jua,button{font-family:'Jua','Noto Sans KR',sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:16px 16px 140px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:20px}
.top span{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px}
h1{font-size:34px;margin:22px 0 4px}
.lead{color:var(--sub);margin:0 0 18px}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px 0 30px}
.node{width:84px;height:84px;border-radius:50%;border:0;font-size:36px;color:#fff;background:var(--acc);box-shadow:0 7px 0 var(--accd);cursor:pointer;position:relative}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--accd)}
.node.done{background:var(--sun);box-shadow:0 7px 0 var(--sund)}
.node.lock{background:var(--lock);box-shadow:0 7px 0 var(--lockd);color:var(--sub);cursor:not-allowed}
.node small{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);white-space:nowrap;color:var(--ink);font-size:16px;font-family:'Jua',sans-serif}
.node .tag{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--acc);border:2px solid var(--line);border-radius:10px;padding:1px 10px;font-size:15px;white-space:nowrap;font-family:'Jua',sans-serif}
.bar{display:flex;align-items:center;gap:12px}
.x{background:none;border:0;font-size:26px;color:var(--sub);cursor:pointer;padding:4px 8px}
.prog{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .35s}
.hp{font-size:20px;min-width:52px;text-align:right}
.qwrap{margin-top:36px}
.qlabel{color:var(--sub);font-size:18px}
.q{font-family:'Jua',sans-serif;font-size:46px;line-height:1.25;margin:10px 0 26px;word-break:keep-all}
.q b{display:inline-block;min-width:56px;text-align:center;border-bottom:5px solid var(--sun);color:var(--sund)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font-size:30px;padding:20px 0;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);cursor:pointer}
.opt.sel{border-color:#3b82f6;box-shadow:0 4px 0 #3b82f6;background:rgba(59,130,246,.12)}
.disp{font-family:'Jua',sans-serif;font-size:40px;text-align:center;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:12px;min-height:72px;margin-bottom:14px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{font-size:26px;padding:12px 0;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer}
.foot{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line)}
.foot.good{background:var(--goodbg)}.foot.bad{background:var(--badbg)}
.foot .in{max-width:520px;margin:0 auto}
.msg{font-family:'Jua',sans-serif;font-size:24px;margin-bottom:10px}
.good .msg{color:var(--accd)}.bad .msg{color:var(--bad)}
.go{width:100%;font-size:22px;padding:15px;border:0;border-radius:16px;color:#fff;background:var(--acc);box-shadow:0 5px 0 var(--accd);cursor:pointer}
.go:disabled{background:var(--lock);box-shadow:0 5px 0 var(--lockd);color:var(--sub);cursor:not-allowed}
.bad .go{background:var(--bad);box-shadow:0 5px 0 #a82a2f}
.res{text-align:center;padding-top:60px}
.res .big{font-size:96px}
.stats{display:flex;gap:12px;justify-content:center;margin:22px 0}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 20px;font-family:'Jua',sans-serif;font-size:24px}
.stat small{display:block;font-size:15px;color:var(--sub)}
button:focus-visible{outline:3px solid #3b82f6;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.gh{font-size:22px;margin:18px 0 8px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gb{font-size:24px;padding:16px 0;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);cursor:pointer}
.gb.on{border-color:var(--acc);box-shadow:0 4px 0 var(--acc);color:var(--acc)}
.chip{font-size:18px;border:2px solid var(--line);background:var(--card);color:var(--acc);border-radius:999px;padding:2px 14px;cursor:pointer;margin-right:6px}
.dl{display:grid;gap:12px;margin-top:10px}
.dc{display:flex;align-items:center;gap:16px;text-align:left;padding:16px 18px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);cursor:pointer;font-size:26px}
.dc.on{border-color:var(--acc);box-shadow:0 4px 0 var(--acc)}
.de{font-size:38px}
.dc small{font-size:15px;color:var(--sub);font-family:'Noto Sans KR',sans-serif}
.node.uno:not(.lock){background:#7c4dff;box-shadow:0 7px 0 #4b2bc2}
.uc{width:64px;height:92px;border-radius:12px;border:3px solid #fff;color:#fff;font-family:'Jua',sans-serif;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.25);padding:0}
button.uc{cursor:pointer}
.uc.r{background:#e8454a}.uc.y{background:#ffbf2f;color:#2a2100}.uc.g{background:#16a87a}.uc.b{background:#3b82f6}
.uc.w{background:conic-gradient(#e8454a 0 25%,#ffbf2f 0 50%,#16a87a 0 75%,#3b82f6 0)}
.uc[disabled]{opacity:.4;cursor:default}
.uc.ok{transform:translateY(-10px)}
.uhand{display:flex;gap:8px;overflow-x:auto;padding:18px 4px 10px;margin-top:8px}
.utab{display:flex;align-items:center;justify-content:center;gap:18px;margin:26px 0 10px}
.upile{background:#1d2b4f;font-size:15px;flex-direction:column;gap:4px;color:#fff;cursor:pointer}
.uai{display:flex;justify-content:center;height:46px;margin-top:16px;padding-left:12px}
.uai i{width:26px;height:40px;border-radius:7px;background:#1d2b4f;border:2px solid #fff;margin-left:-12px}
.ucol{width:26px;height:26px;border-radius:50%;border:3px solid var(--card)}
.umsg{text-align:center;min-height:56px;font-family:'Jua',sans-serif;font-size:19px;padding:0 6px}
.uchoose{display:flex;gap:12px;justify-content:center;margin:4px 0 8px;align-items:center;flex-wrap:wrap}
.uchoose button{width:56px;height:56px;border-radius:50%;border:3px solid #fff;cursor:pointer}
.top{flex-wrap:wrap}
.goal{position:relative;height:26px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
.goal i{position:absolute;inset:0 auto 0 0;background:var(--sun);border-radius:99px;transition:width .4s}
.goal b{position:relative;display:block;text-align:center;font-family:'Jua',sans-serif;font-size:15px;line-height:26px;color:var(--ink)}
/* ===== 상자 열기 연출 ===== */
.cs{position:relative;width:220px;height:190px;margin:18px auto 8px;cursor:pointer;animation:cbob 2.4s ease-in-out infinite}
.cs .gl{position:absolute;left:20px;right:20px;top:30px;height:70px;border-radius:50%;background:radial-gradient(#fff,#fff0 70%);opacity:0;transition:opacity .3s}
.cs .bd{position:absolute;left:4px;right:4px;bottom:0;height:112px;background:linear-gradient(#3a52d6,#1b2a8a);border:4px solid #0b1235;border-radius:10px 10px 24px 24px}
.cs .bd::before{content:"";position:absolute;left:10px;right:10px;top:12px;height:10px;border-radius:6px;background:rgba(255,255,255,.18)}
.cs .cn{position:absolute;bottom:-4px;width:46px;height:34px;background:#ff5a8a;border:4px solid #0b1235;border-radius:8px 8px 18px 18px}
.cs .cn.l{left:-4px}.cs .cn.r{right:-4px}
.cs .lid{position:absolute;left:-4px;right:-4px;top:22px;height:78px;background:linear-gradient(#ffe066,#f5a623);border:4px solid #0b1235;border-radius:36px 36px 8px 8px;transform-origin:8% 100%;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.cs .hd{position:absolute;left:70px;right:70px;top:-20px;height:24px;background:#26308f;border:4px solid #0b1235;border-radius:10px 10px 0 0}
.cs .em{position:absolute;left:50%;top:14px;margin-left:-26px;width:52px;height:52px;border-radius:50%;background:#26308f;border:4px solid #0b1235;color:#ffe066;font-size:28px;line-height:44px;text-align:center}
.cs .lk{position:absolute;left:50%;margin-left:-20px;bottom:-22px;width:40px;height:34px;background:#ff5a8a;border:4px solid #0b1235;border-radius:8px}
.cs.shk{animation:cshake .12s linear infinite}
.cs.open{animation:none}
.cs.open .lid{transform:rotate(-38deg) translate(-12px,-22px)}
.cs.open .gl{opacity:1}
@keyframes cbob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
@keyframes cshake{0%,100%{transform:rotate(-6deg) scale(1.03)}50%{transform:rotate(6deg) scale(1.03)}}
.stage{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;text-align:center;padding:20px;
 background:radial-gradient(circle at 50% 42%,#37d0ff,#0a56dc 58%,#071f63);overflow:hidden;user-select:none}
.stage::before{content:"";position:absolute;left:50%;top:42%;width:230vmax;height:230vmax;margin:-115vmax 0 0 -115vmax;background:repeating-conic-gradient(rgba(255,255,255,.09) 0 8deg,transparent 8deg 20deg);animation:spin 40s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.stage>*{position:relative}
.stage .hint{font-family:'Jua',sans-serif;font-size:24px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.stage .sk{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:rgba(0,0,0,.28);border:0;color:#fff;border-radius:999px;padding:6px 16px;font-size:16px;cursor:pointer}
.flash{position:fixed;inset:0;background:#fff;z-index:30;pointer-events:none;animation:fl .6s ease-out forwards}
@keyframes fl{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.rw{width:200px;height:200px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:120px;animation:rpop .55s cubic-bezier(.3,1.5,.5,1) both;
 background:radial-gradient(#ffffff55,#ffffff00 70%);filter:drop-shadow(0 10px 0 rgba(0,0,0,.25))}
.rw.r2{background:radial-gradient(#d9b3ff99,#d9b3ff00 70%)}
.rw.r3{background:radial-gradient(#ffe066cc,#ffe06600 70%)}
@keyframes rpop{0%{transform:scale(.1) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.rt{font-family:'Jua',sans-serif;font-size:44px;text-shadow:0 4px 0 rgba(0,0,0,.4);animation:rpop .5s .15s cubic-bezier(.3,1.5,.5,1) both}
.rt.r2{color:#e6ccff}.rt.r3{color:#ffe066}
.rc{font-size:16px;opacity:.85}
.stage .sum{width:100%;max-width:520px}
.stage .cgrid .ci{background:var(--card);color:var(--ink)}

/* ===== 출석체크 ===== */
.chip{position:relative}
.chip .dot{display:block;position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:#ef4444;border:2px solid var(--card)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}
.cal b{font-size:14px;text-align:center;opacity:.7}
.cal .d{aspect-ratio:1;border-radius:12px;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;position:relative}
.cal .d.f{opacity:.4}.cal .d.e{visibility:hidden}
.cal .d.on{background:#12b76a33;border-color:#12b76a}
.cal .d.on::after{content:"✅";position:absolute;font-size:20px}
.cal .d.on span{opacity:.0}
.cal .d.t{border-color:#ffbf2f;box-shadow:0 0 0 2px #ffbf2f55}
.ms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 6px}
.ms div{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 4px;text-align:center;font-size:13px;line-height:1.35}
.ms div b{display:block;font-size:16px}
.ms div.ok{border-color:#12b76a;background:#12b76a22}

.boxbig{font-size:110px;text-align:center;margin:18px 0 8px}
.shake{animation:sh .25s infinite}
@keyframes sh{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg) scale(1.1)}}
.go.pu{background:#7c4dff;box-shadow:0 5px 0 #4b2bc2}
.go.pu:disabled{background:var(--lock);box-shadow:0 5px 0 var(--lockd)}
.cgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cgrid.rs{grid-template-columns:repeat(5,1fr)}
.ci{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:26px;position:relative}
.ci small{position:absolute;right:3px;bottom:1px;font-size:11px;font-family:'Jua',sans-serif;color:var(--sub)}
.ci.no{filter:grayscale(1) brightness(.6);opacity:.35}
.ci.r2{border-color:#3b82f6}.ci.r3{border-color:#ffbf2f;box-shadow:0 0 12px #ffbf2f}
.one{display:flex;justify-content:center;margin:20px 0}.one .ci{width:130px;font-size:70px}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
button.ci{color:var(--ink);cursor:pointer;padding:0;font-family:inherit}
button.ci:disabled{cursor:default}
.ci.eq{outline:3px solid var(--acc);outline-offset:2px}
.chip:disabled{opacity:.45;cursor:default}
.go.yl{background:var(--sun);box-shadow:0 5px 0 var(--sund);color:#2a2100}
.go.yl:disabled{background:var(--lock);box-shadow:0 5px 0 var(--lockd);color:var(--sub)}
.rk{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line);margin-bottom:8px;font-family:'Jua',sans-serif;font-size:20px}
.rk.me{border-color:var(--acc);background:var(--goodbg)}
.rk b{width:28px;color:var(--sub);font-weight:400}
.rk .x{margin-left:auto}
.tier{text-align:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin:12px 0 16px;font-family:'Jua',sans-serif;font-size:28px}
.tier small{display:block;font-size:15px;color:var(--sub);font-family:'Noto Sans KR',sans-serif}
:root[data-theme="dark"]{--bg:#1a1530;--card:#262045;--line:#3a3366;--ink:#f1edff;--sub:#a59fcb;--acc:#f26a2e;--accd:#b84a14;--goodbg:#12403a;--badbg:#4a2036;--lock:#3a3366;--lockd:#2b2650}
body{background-image:none}
#nav{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line);z-index:5}
#nav button{flex:1;max-width:84px;font-size:26px;padding:8px 0;border-radius:14px;border:2px solid transparent;background:none;cursor:pointer;color:var(--ink)}
#nav button.on{border-color:#3b82f6;background:rgba(59,130,246,.18)}
#nav button:disabled{opacity:.35;cursor:default}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--acc);color:#fff;border-radius:18px;padding:14px 16px;margin-top:14px;box-shadow:0 4px 0 var(--accd)}
.sec small{font-size:14px;opacity:.92;font-weight:700}
.sec .jua{font-size:23px;display:block;margin-top:2px}
.secb{background:rgba(0,0,0,.2);border:0;border-radius:12px;font-size:24px;padding:8px 12px;cursor:pointer;color:#fff}
.mas{position:absolute;top:8px;font-size:54px;pointer-events:none;line-height:1}
.node.chest:not(.lock){background:#f5b82e;box-shadow:0 7px 0 #b97f00}
body{background-image:radial-gradient(circle at 12% 0,rgba(242,106,46,.16),transparent 42%),radial-gradient(circle at 92% 32%,rgba(56,189,248,.12),transparent 46%)}
.node{border-radius:30px}
.node.done{background:#38bdf8;box-shadow:0 7px 0 #0b86b8}
.node.uno:not(.lock){background:#ec4899;box-shadow:0 7px 0 #a8206a}
.good .msg{color:#34d399}
.good .go{background:#14b87a;box-shadow:0 5px 0 #0b7d52}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" aria-label="메뉴"></nav>
<script>
const GOOGLE_CLIENT_ID='YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com'; // ← 구글 클라우드 콘솔에서 발급받은 웹 클라이언트 ID
const SES='mathstep_session';
const gid=()=>{try{const v=localStorage.getItem('mathstep_gid');if(v)return v}catch(e){}return GOOGLE_CLIENT_ID};
const gidOk=()=>!gid().startsWith('YOUR_');
let LS='mathstep_v1',U0=null;
let D={xp:0,pr:{},grade:null,diff:null,streak:0,last:''};
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){}};
function loadData(){
 D={xp:0,pr:{},grade:null,diff:null,streak:0,last:''};
 try{const s=JSON.parse(localStorage.getItem(LS));if(s&&typeof s==='object')D=Object.assign(D,s)}catch(e){}
}
function getSession(){try{const s=JSON.parse(localStorage.getItem(SES));return s&&s.type?s:null}catch(e){return null}}
function setSession(u){
 U0=u;
 if(u.type==='google'){
  LS='mathstep_g_'+u.sub;
  // 이 구글 계정으로 처음 들어오면, 이 기기의 게스트 기록을 이어받을 수 있게 복사
  try{if(!localStorage.getItem(LS)){const g=localStorage.getItem('mathstep_v1');if(g)localStorage.setItem(LS,g)}}catch(e){}
 }else if(u.type==='nick'){
  LS='mathstep_n_'+u.name.toLowerCase();
  try{if(!localStorage.getItem(LS)){const g=localStorage.getItem('mathstep_v1');if(g)localStorage.setItem(LS,g)}}catch(e){}
 }else LS='mathstep_v1';
 try{localStorage.setItem(SES,JSON.stringify(u))}catch(e){}
 loadData();
}
function jwtPayload(t){
 const b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
 return JSON.parse(decodeURIComponent(atob(b).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
}
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const day=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return d.toDateString()};

const GN=['초1','초2','초3','초4','초5','초6','중1','중2','중3','고1','고2','고3'];
const sup='⁰¹²³⁴⁵⁶⁷⁸⁹',sub='₀₁₂₃₄₅₆₇₈₉';
const fm=n=>n<0?'−'+(-n):''+n,P=n=>n<0?`(−${-n})`:''+n;
const gcd=(a,b)=>b?gcd(b,a%b):a;
const T3=[[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15],[7,24,25]];
const A=(l,h)=>()=>{const x=R(l,h),y=R(l,h);return[`${x} + ${y} = ?`,x+y]};

function boot(){const u=getSession();if(u){setSession(u);enter()}else loginScreen()}
boot();
